[workspace]
members = ["pool-prf", "pool-oprf", "pool-psi", "pool-psi-cli", "pool-voprf"]
resolver = "2"

[workspace.dependencies]
pool-prf = { path = "pool-prf" }
pool-oprf = { path = "pool-oprf" }
pool-psi = { path = "pool-psi" }
pool-voprf = { path = "pool-voprf" }

# CryProt, pinned to a commit on main.
cryprot-core = { git = "https://github.com/robinhundt/CryProt.git", rev = "5797f44" }
cryprot-net = { git = "https://github.com/robinhundt/CryProt.git", rev = "5797f44" }
cryprot-ot = { git = "https://github.com/robinhundt/CryProt.git", rev = "5797f44", features = [
    "ml-kem-base-ot-768",
] }

# Plonky3, pinned to a commit on main.
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "463b44c3b52e6cecb4b27e06abb37dd3b6c35c83" }

# Common
anyhow = "1.0.104"
async-trait = "0.1"
bincode = "=1.3.3"
bitstream-io = "4.10.0"
bitvec = "1.0"
blake3 = "1.5"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.32"
rand = "0.10"
s2n-quic = "1.86.0"
# Not used directly: it turns on the `pq` feature of the s2n-tls that s2n-quic
# already pulls in, so the hybrid ML-KEM policy exists.
s2n-tls = { version = "0.3.42", features = ["pq"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(s2n_quic_enable_pq_tls)'] }

[workspace.lints.clippy]
# Prefer From over `as` where the conversion cannot lose anything.
cast_lossless = "warn"
